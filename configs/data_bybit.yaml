exchange: bybit
market: linear
symbol: BTCUSDT
start_date: "2024-01-01"
end_date: "2024-01-02"
datasets:
  - trades
  - orderbook
raw_dir: data/raw/bybit
processed_dir: data/processed/bybit
timeout_seconds: 30
# Archive filename templates are configurable so a dataset can use .csv,
# .csv.gz, or .zip without changing downloader code.
filename_templates:
  trades: "{symbol}_{dataset}_{date}.csv.gz"
  orderbook: "{symbol}_{dataset}_{date}.csv.gz"
# URL templates are intentionally configurable because Bybit archive paths can
# change by market, dataset, and archive format. Supported placeholders:
# {symbol}, {date}, {filename}
url_templates:
  trades: "https://public.bybit.com/trading/{symbol}/{filename}"
  orderbook: "https://public.bybit.com/orderbook/{symbol}/{filename}"
