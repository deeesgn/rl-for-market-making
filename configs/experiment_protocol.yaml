exchange: Bybit
instrument: BTCUSDT Perpetual
date_range:
  start: "2024-01-01"
  end: "2025-12-31"
split:
  train: 0.75
  validation: 0.10
  test: 0.15
  method: chronological
  shuffle: false
data:
  replay_frequency: 1s
  book_depth: 10
trading:
  initial_capital: 10000
  maker_fee: 0.0002
  taker_fee: 0.00055
  latency_ms: 0
  max_inventory_btc: 0.02
evaluation:
  seeds:
    - 42
    - 100
    - 200
  episodes: 20
required_metrics:
  - total_pnl
  - total_reward
  - sharpe_ratio
  - maximum_drawdown
  - max_abs_inventory
  - mean_abs_inventory
  - final_inventory
  - quote_rate
  - fill_rate
